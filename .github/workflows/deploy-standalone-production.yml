name: Deploy Standalone Production

on:
  workflow_dispatch:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - '.github/workflows/deploy-standalone-production.yml'
      - 'wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: motorsales365-standalone-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TARGET_SUPABASE_SERVICE_ROLE_KEY }}
      SIGNUP_AUDIT_SALT: ${{ secrets.SIGNUP_AUDIT_SALT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      EMAIL_QUEUE_CRON_TOKEN: ${{ secrets.EMAIL_QUEUE_CRON_TOKEN }}
      STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
      STRIPE_SANDBOX_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY }}
      PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
      PAYMENTS_SANDBOX_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_SANDBOX_WEBHOOK_SECRET }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      INVOLVE_ASIA_AFFILIATE_ID: ${{ secrets.INVOLVE_ASIA_AFFILIATE_ID }}
      INVOLVE_ASIA_API_KEY_NAME: ${{ secrets.INVOLVE_ASIA_API_KEY_NAME }}
      INVOLVE_ASIA_API_SECRET: ${{ secrets.INVOLVE_ASIA_API_SECRET }}
      PRODUCTION_URL: https://www.365motorsales.com
      STANDALONE_SUPABASE_REF: wjxaajgvddtrxxtocxen
      LOVABLE_SOURCE_REF: jfjrnjyroxvlydajvndl
      ACCEPTANCE_LISTING_ID: a60923a9-e834-4432-9061-563358bc3d9a

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bind Vite client to standalone Supabase
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const vars = config.vars ?? {};
          const expectedProject = process.env.STANDALONE_SUPABASE_REF;
          const expectedUrl = `https://${expectedProject}.supabase.co`;

          if (vars.SUPABASE_PROJECT_ID !== expectedProject || vars.SUPABASE_URL !== expectedUrl) {
            console.error('Production build blocked: wrangler public Supabase config does not match the standalone project.');
            process.exit(1);
          }
          if (!vars.SUPABASE_PUBLISHABLE_KEY) {
            console.error('Production build blocked: standalone Supabase publishable key is missing from wrangler config.');
            process.exit(1);
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `VITE_SUPABASE_URL=${vars.SUPABASE_URL}\nVITE_SUPABASE_PUBLISHABLE_KEY=${vars.SUPABASE_PUBLISHABLE_KEY}\n`,
          );
          console.log('Bound Vite client to standalone Supabase public configuration without printing values.');
          NODE

      - name: Verify Cloudflare deployment credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Production deployment blocked: CLOUDFLARE_API_TOKEN is not configured.' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Production deployment blocked: CLOUDFLARE_ACCOUNT_ID is not configured.' >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'Production deployment blocked: TARGET_SUPABASE_SERVICE_ROLE_KEY is not configured.' >&2; exit 1; }
          echo 'Cloudflare credentials and standalone core secret are present. No values are printed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify service-role key belongs to standalone Supabase
        shell: bash
        run: |
          set -euo pipefail
          target="https://${STANDALONE_SUPABASE_REF}.supabase.co/rest/v1/profiles?select=id&limit=1"
          code="$(curl --silent --show-error --output /tmp/service-role-check.json --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "$target")"
          if [[ "$code" != '200' ]]; then
            echo "Production deployment blocked: target service-role key did not authenticate against ${STANDALONE_SUPABASE_REF} (HTTP ${code})." >&2
            exit 1
          fi
          rm -f /tmp/service-role-check.json
          echo 'Standalone Supabase service-role credential verified against the target project. Value was not printed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run standalone runtime guard
        shell: bash
        run: |
          set -euo pipefail
          matches="$({
            grep -RInE \
              --exclude='*.map' \
              --exclude='qr-rescue-detector.tsx' \
              --exclude-dir=node_modules \
              'jfjrnjyroxvlydajvndl|\.lovableproject\.com|lovable\.dev/api|lovable\.app/api' \
              src wrangler.jsonc vite.config.ts || true
          } | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*|\*/)' || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            echo 'Production deployment blocked: Lovable source/runtime endpoint found.' >&2
            exit 1
          fi

      - name: Run unit tests
        run: npm test

      - name: Build standalone production application
        run: npm run build

      - name: Verify generated deployment is standalone production
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'dist/server/wrangler.json';
          const expectedName = 'motorsales365';
          const expectedProject = 'wjxaajgvddtrxxtocxen';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (config.name !== expectedName) {
            console.error(`Blocked: generated Worker name is ${JSON.stringify(config.name)}, expected ${JSON.stringify(expectedName)}.`);
            process.exit(1);
          }

          if (config.vars?.SUPABASE_PROJECT_ID !== expectedProject) {
            console.error('Blocked: generated production Worker does not target the standalone Supabase project.');
            process.exit(1);
          }

          console.log('Verified production Worker name and standalone Supabase target.');
          NODE

      - name: Reject source Supabase ref in built runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rq --exclude='*.map' "${LOVABLE_SOURCE_REF}" dist; then
            echo 'Production deployment blocked: source Supabase ref found in built runtime.' >&2
            exit 1
          fi

      - name: Reject Lovable endpoint in built runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -REqi --exclude='*.map' '\.lovableproject\.com|lovable\.dev/api|lovable\.app/api' dist; then
            echo 'Production deployment blocked: Lovable endpoint found in built runtime.' >&2
            exit 1
          fi

      - name: Reject exact configured secrets in built runtime
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SUPABASE_SERVICE_ROLE_KEY SIGNUP_AUDIT_SALT \
            RESEND_API_KEY RESEND_WEBHOOK_SECRET EMAIL_QUEUE_CRON_TOKEN \
            STRIPE_LIVE_API_KEY STRIPE_SANDBOX_API_KEY \
            PAYMENTS_LIVE_WEBHOOK_SECRET PAYMENTS_SANDBOX_WEBHOOK_SECRET \
            GOOGLE_MAPS_API_KEY AI_API_KEY FIRECRAWL_API_KEY GIPHY_API_KEY \
            INVOLVE_ASIA_AFFILIATE_ID INVOLVE_ASIA_API_KEY_NAME INVOLVE_ASIA_API_SECRET
          do
            value="${!name:-}"
            [[ -z "$value" ]] && continue
            if grep -RFq --exclude='*.map' -- "$value" dist/server; then
              echo "Production deployment blocked: configured secret ${name} was embedded in the built runtime." >&2
              exit 1
            fi
          done
          echo 'Exact configured-secret leak scan passed; no secret values were printed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Require standalone Supabase ref in server runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -Rq --exclude='*.map' "${STANDALONE_SUPABASE_REF}" dist/server || {
            echo 'Production deployment blocked: standalone Supabase ref not found in server runtime.' >&2
            exit 1
          }

      - name: Require standalone Supabase ref in browser runtime
        shell: bash
        run: |
          set -euo pipefail
          browser_match="$(grep -RIl --exclude='*.map' "${STANDALONE_SUPABASE_REF}" dist | grep -v '^dist/server/' | head -n 1 || true)"
          test -n "$browser_match" || {
            echo 'Production deployment blocked: standalone Supabase ref not found in browser runtime.' >&2
            exit 1
          }
          echo 'Verified browser and server runtimes both target standalone Supabase.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare atomic production secret payload
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names = [
            'SUPABASE_SERVICE_ROLE_KEY', 'SIGNUP_AUDIT_SALT',
            'RESEND_API_KEY', 'RESEND_WEBHOOK_SECRET', 'EMAIL_QUEUE_CRON_TOKEN',
            'STRIPE_LIVE_API_KEY', 'STRIPE_SANDBOX_API_KEY',
            'PAYMENTS_LIVE_WEBHOOK_SECRET', 'PAYMENTS_SANDBOX_WEBHOOK_SECRET',
            'GOOGLE_MAPS_API_KEY', 'AI_API_BASE_URL', 'AI_API_KEY', 'AI_MODEL',
            'FIRECRAWL_API_KEY', 'GIPHY_API_KEY',
            'INVOLVE_ASIA_AFFILIATE_ID', 'INVOLVE_ASIA_API_KEY_NAME', 'INVOLVE_ASIA_API_SECRET',
          ];
          const payload = {};
          for (const name of names) {
            const value = process.env[name];
            if (value) payload[name] = value;
          }
          if (!payload.SUPABASE_SERVICE_ROLE_KEY) {
            console.error('Production deployment blocked: core Supabase secret missing from atomic payload.');
            process.exit(1);
          }
          fs.writeFileSync('/tmp/production-secrets.json', JSON.stringify(payload), { mode: 0o600 });
          console.log(`Prepared ${Object.keys(payload).length} configured secret bindings without printing values.`);
          NODE

      - name: Strip server source maps before production deploy
        shell: bash
        run: find dist/server -type f -name '*.map' -delete

      - name: Deploy standalone production Worker with target secrets atomically
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/production-secrets.json || { echo 'Atomic production secret payload is unavailable.' >&2; exit 1; }
          npx wrangler deploy --secrets-file /tmp/production-secrets.json

      - name: Remove local production secret payload
        if: always()
        shell: bash
        run: rm -f /tmp/production-secrets.json /tmp/service-role-check.json

      - name: Verify production Worker secret bindings by name only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name motorsales365 > /tmp/production-secret-list.json
          grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' /tmp/production-secret-list.json || {
            echo 'Production deployment blocked: SUPABASE_SERVICE_ROLE_KEY binding is absent after deploy.' >&2
            exit 1
          }
          if grep -Eqi 'lovable|jfjrnjyroxvlydajvndl' /tmp/production-secret-list.json; then
            echo 'Production independence audit blocked: a Lovable/source-named Worker secret binding remains.' >&2
            exit 1
          fi
          rm -f /tmp/production-secret-list.json
          echo 'Production Worker core secret binding verified by name; no Lovable/source-named binding observed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test production Worker
        shell: bash
        run: |
          set -euo pipefail
          echo "Smoke testing ${PRODUCTION_URL}/"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            --output /tmp/production-home.html \
            "${PRODUCTION_URL}/"
          test -s /tmp/production-home.html || { echo 'Production smoke test returned an empty response body.' >&2; exit 1; }

      - name: Accept public standalone production routes
        shell: bash
        run: |
          set -euo pipefail

          fetch_route() {
            local route="$1"
            local output="$2"
            local effective
            echo "Testing ${PRODUCTION_URL}${route}"
            effective="$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --retry 6 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 60 \
              --output "$output" \
              --write-out '%{url_effective}' \
              "${PRODUCTION_URL}${route}")"

            test -s "$output" || { echo "${route} returned an empty body." >&2; exit 1; }
            if [[ "$effective" == *"${LOVABLE_SOURCE_REF}"* || "$effective" == *"lovable"* ]]; then
              echo "${route} redirected to a Lovable/source endpoint: ${effective}" >&2
              exit 1
            fi
          }

          fetch_route '/' /tmp/accept-home.html
          fetch_route '/businesses' /tmp/accept-businesses.html
          fetch_route '/map' /tmp/accept-map.html
          fetch_route "/listing/${ACCEPTANCE_LISTING_ID}" /tmp/accept-listing.html

          for body in /tmp/accept-home.html /tmp/accept-businesses.html /tmp/accept-map.html /tmp/accept-listing.html; do
            if grep -Eqi "${LOVABLE_SOURCE_REF}|\.lovableproject\.com|lovable\.dev/api|lovable\.app/api" "$body"; then
              echo "Production acceptance blocked: source/Lovable runtime reference found in ${body}." >&2
              exit 1
            fi
          done

          grep -Fqi '2007 civic' /tmp/accept-listing.html || {
            echo 'Active standalone listing did not render its expected server-side title.' >&2
            exit 1
          }

          grep -Fqi "https://${STANDALONE_SUPABASE_REF}.supabase.co/storage/v1/object/public/" /tmp/accept-listing.html || {
            echo 'Active listing did not render a standalone Supabase Storage URL.' >&2
            exit 1
          }

          media_url="$(grep -aEo "https://${STANDALONE_SUPABASE_REF}\.supabase\.co/storage/v1/object/public/[^\"<> ]+" /tmp/accept-listing.html | head -n 1 || true)"
          test -n "$media_url" || { echo 'Could not extract standalone listing media URL.' >&2; exit 1; }

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 60 \
            --range 0-0 \
            --output /dev/null \
            "$media_url"

          echo 'Production cutover acceptance passed for homepage, businesses, map, active listing, and target Storage media.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Lovable/source runtime reference was observed in tested production responses.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record production deployment result
        if: success()
        run: |
          echo 'Standalone production Worker deployed successfully.' >> "$GITHUB_STEP_SUMMARY"
          echo "Production: ${PRODUCTION_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Supabase project: ${STANDALONE_SUPABASE_REF}" >> "$GITHUB_STEP_SUMMARY"
