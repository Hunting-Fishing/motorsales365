name: Recover demo Lovable assets

on:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - .github/workflows/recover-demo-lovable-assets.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      TARGET_SUPABASE_URL: https://wjxaajgvddtrxxtocxen.supabase.co
      CELICA_SOURCE_URL: https://365motorsales.com/__l5e/assets-v1/1ea6ebb5-24b0-46e3-ba59-4995eeb16e0c/celica.jpg
      SKYLINE_SOURCE_URL: https://365motorsales.com/__l5e/assets-v1/06e53b05-6234-4284-ab5a-21036610061a/r32.jpg
      CELICA_MEDIA_ID: b3657ced-2088-4bf4-97ce-1e9b1886ccef
      SKYLINE_MEDIA_ID: af166605-6fd9-4e4f-b49d-dc6f46d2a018
      CELICA_STORAGE_PATH: migration-recovered/demo/b9eb4500-f9b4-41aa-98d8-35f3454f849f/celica.jpg
      SKYLINE_STORAGE_PATH: migration-recovered/demo/db7df908-c8a8-4bd5-910f-51a4f71c2939/r32.jpg
    steps:
      - name: Validate recovery credential is present
        env:
          SERVICE_ROLE_KEY: ${{ secrets.TARGET_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVICE_ROLE_KEY"
          echo "Target recovery credential is present."

      - name: Download original Lovable demo assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 "$CELICA_SOURCE_URL" -o /tmp/celica.jpg
          curl --fail --location --silent --show-error --retry 2 "$SKYLINE_SOURCE_URL" -o /tmp/r32.jpg

          celica_type="$(file --brief --mime-type /tmp/celica.jpg)"
          skyline_type="$(file --brief --mime-type /tmp/r32.jpg)"
          celica_size="$(stat -c%s /tmp/celica.jpg)"
          skyline_size="$(stat -c%s /tmp/r32.jpg)"

          case "$celica_type" in image/*) ;; *) echo "Celica source was not an image: $celica_type"; exit 1;; esac
          case "$skyline_type" in image/*) ;; *) echo "Skyline source was not an image: $skyline_type"; exit 1;; esac
          test "$celica_size" -gt 1024
          test "$skyline_size" -gt 1024

          echo "Celica recovered: $celica_type, $celica_size bytes"
          echo "Skyline recovered: $skyline_type, $skyline_size bytes"
          echo "Celica SHA256: $(sha256sum /tmp/celica.jpg | cut -d' ' -f1)"
          echo "Skyline SHA256: $(sha256sum /tmp/r32.jpg | cut -d' ' -f1)"

      - name: Upload recovered images to standalone Supabase Storage
        env:
          SERVICE_ROLE_KEY: ${{ secrets.TARGET_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            local file="$1"
            local path="$2"
            local mime="$3"
            local status
            status="$(curl --silent --show-error --output /tmp/upload-response.txt --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $SERVICE_ROLE_KEY" \
              --header "apikey: $SERVICE_ROLE_KEY" \
              --header "Content-Type: $mime" \
              --header "x-upsert: true" \
              --data-binary "@$file" \
              "$TARGET_SUPABASE_URL/storage/v1/object/listing-photos/$path")"
            if [[ "$status" != "200" && "$status" != "201" ]]; then
              echo "Storage upload failed with HTTP $status"
              cat /tmp/upload-response.txt
              exit 1
            fi
          }

          upload /tmp/celica.jpg "$CELICA_STORAGE_PATH" "$(file --brief --mime-type /tmp/celica.jpg)"
          upload /tmp/r32.jpg "$SKYLINE_STORAGE_PATH" "$(file --brief --mime-type /tmp/r32.jpg)"
          echo "Recovered images uploaded to standalone storage."

      - name: Point the two demo listings at recovered standalone images
        env:
          SERVICE_ROLE_KEY: ${{ secrets.TARGET_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          CELICA_PUBLIC="$TARGET_SUPABASE_URL/storage/v1/object/public/listing-photos/$CELICA_STORAGE_PATH"
          SKYLINE_PUBLIC="$TARGET_SUPABASE_URL/storage/v1/object/public/listing-photos/$SKYLINE_STORAGE_PATH"
          CELICA_SHA="$(sha256sum /tmp/celica.jpg | cut -d' ' -f1)"
          SKYLINE_SHA="$(sha256sum /tmp/r32.jpg | cut -d' ' -f1)"

          patch_media() {
            local id="$1"
            local public_url="$2"
            local path="$3"
            local sha="$4"
            local body status
            body="$(jq -cn --arg u "$public_url" --arg p "$path" --arg s "$sha" '{url:$u,storage_path:$p,file_sha256:$s}')"
            status="$(curl --silent --show-error --output /tmp/patch-response.txt --write-out '%{http_code}' \
              --request PATCH \
              --header "Authorization: Bearer $SERVICE_ROLE_KEY" \
              --header "apikey: $SERVICE_ROLE_KEY" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=minimal" \
              --data "$body" \
              "$TARGET_SUPABASE_URL/rest/v1/listing_media?id=eq.$id")"
            if [[ "$status" != "204" && "$status" != "200" ]]; then
              echo "Media row update failed with HTTP $status"
              cat /tmp/patch-response.txt
              exit 1
            fi
          }

          patch_media "$CELICA_MEDIA_ID" "$CELICA_PUBLIC" "$CELICA_STORAGE_PATH" "$CELICA_SHA"
          patch_media "$SKYLINE_MEDIA_ID" "$SKYLINE_PUBLIC" "$SKYLINE_STORAGE_PATH" "$SKYLINE_SHA"
          echo "Demo media rows now reference standalone storage."

      - name: Verify public recovered files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --range 0-63 "$TARGET_SUPABASE_URL/storage/v1/object/public/listing-photos/$CELICA_STORAGE_PATH" >/dev/null
          curl --fail --silent --show-error --range 0-63 "$TARGET_SUPABASE_URL/storage/v1/object/public/listing-photos/$SKYLINE_STORAGE_PATH" >/dev/null
          echo "Both recovered standalone images are publicly readable."
