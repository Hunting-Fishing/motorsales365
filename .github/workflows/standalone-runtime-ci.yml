name: Standalone Runtime CI

on:
  push:
    branches:
      - migration/standalone-supabase-365
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  standalone-runtime:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'migration/standalone-supabase-365' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        # The migration branch carries a regenerated npm lockfile with removed
        # Lovable packages absent. --legacy-peer-deps remains required because
        # @tanstack/zod-adapter currently declares a Zod 3 peer while this app
        # intentionally runs Zod 4.
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Guard standalone runtime from Lovable source endpoints
        shell: bash
        run: |
          set -euo pipefail
          matches="$({
            grep -RInE \
              --exclude='*.map' \
              --exclude='qr-rescue-detector.tsx' \
              --exclude-dir=node_modules \
              'jfjrnjyroxvlydajvndl|\.lovableproject\.com|lovable\.dev/api|lovable\.app/api' \
              src wrangler.jsonc vite.config.ts || true
          } | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*|\*/)' || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            echo 'Standalone runtime still contains a Lovable source/runtime endpoint.' >&2
            exit 1
          fi

      # Run tests against the clean checked-out source tree before TanStack/Vite
      # build generation. This prevents generated build artifacts from being
      # mistaken for repository-owned tests while preserving the full test suite.
      - name: Run unit tests
        run: npm test

      - name: Build standalone application
        run: npm run build

      # Validate that the isolated staging Worker can be packaged with the
      # checked-in public configuration. --dry-run does not deploy or alter
      # production and does not require private provider secret values.
      - name: Validate standalone staging Worker package
        run: npx wrangler deploy --dry-run --env staging
