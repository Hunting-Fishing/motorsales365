name: Standalone Runtime CI

on:
  push:
    branches:
      - migration/standalone-supabase-365
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  standalone-runtime:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'migration/standalone-supabase-365' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install declared dependencies
        # package.json has moved ahead of every committed lockfile. For the
        # standalone cutover gate, first prove the current declarations build.
        # Lockfile normalization is tracked separately and must not mask runtime
        # failures during the Lovable exit.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Guard standalone runtime from Lovable source endpoints
        shell: bash
        run: |
          set -euo pipefail
          matches="$({
            grep -RInE \
              --exclude='*.map' \
              --exclude='qr-rescue-detector.tsx' \
              --exclude-dir=node_modules \
              'jfjrnjyroxvlydajvndl|\.lovableproject\.com|lovable\.dev/api|lovable\.app/api' \
              src wrangler.jsonc vite.config.ts || true
          } | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*|\*/)' || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            echo 'Standalone runtime still contains a Lovable source/runtime endpoint.' >&2
            exit 1
          fi

      - name: Build standalone application
        run: npm run build

      - name: Run unit tests
        run: npm test
