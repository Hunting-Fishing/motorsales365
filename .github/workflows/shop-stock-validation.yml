name: Shop Manager stock integration
on:
  pull_request:
    branches:
      - completion/365-seven-day-integration
    paths:
      - src/lib/shop-stock-operation*
      - src/components/shop-manager/stock-adjustment*
      - src/routes/_authenticated/workspace.inventory.$id.tsx
      - scripts/client-release/shop-stock*
      - scripts/client-release/build-shop-stock-staging-release.mjs
      - scripts/client-release/business-staff-boundary.sql
      - scripts/client-release/business-staff-lifecycle.mjs
      - supabase/releases/shop-stock-*.sql
      - .github/workflows/shop-stock-validation.yml
permissions:
  contents: read
jobs:
  shop-stock:
    name: Shop stock UI, contract, SQL and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Actual native inventory route and recovery dialog
        run: npx vitest run src/components/shop-manager/stock-adjustment.test.tsx --maxWorkers=1
      - name: Actual contracts, authenticated SQL, retained audit and source integrity
        run: node --test --test-concurrency=1 scripts/client-release/shop-stock-contract.test.mjs scripts/client-release/shop-stock-operation.test.mjs scripts/parts-stock/writer-frontier.test.mjs
      - name: Produce complete unapplied shop and business staging package
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/shop-stock-staging"
          mkdir -m 700 "$out"
          node scripts/client-release/build-shop-stock-staging-release.mjs > "$out/shop-stock-forward.sql"
          cp supabase/releases/shop-stock-suspend-v1.sql supabase/releases/business-stock-suspend-v1.sql "$out/"
          cp docs/SHOP_STOCK_ADJUSTMENT_INTEGRATION.md "$out/"
          cd "$out"
          sha256sum shop-stock-forward.sql shop-stock-suspend-v1.sql business-stock-suspend-v1.sql SHOP_STOCK_ADJUSTMENT_INTEGRATION.md > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: shop-stock-staging-package
          path: ${{ runner.temp }}/shop-stock-staging/
          if-no-files-found: error
          retention-days: 7
  native-shop-stock:
    name: Native PG17 shop stock concurrency and audit
    needs: shop-stock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL 17 on the ephemeral runner
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_CODENAME" = noble
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location --max-time 60 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          printf '\ncreate_main_cluster = false\n' \
            | sudo tee -a /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-17 postgresql-client-17
          /usr/lib/postgresql/17/bin/postgres --version
      - name: Five independent-session shop stock and selection races
        timeout-minutes: 3
        run: node scripts/client-release/shop-stock-native.mjs
