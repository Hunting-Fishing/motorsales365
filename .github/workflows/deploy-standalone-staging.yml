name: Deploy Standalone Staging

on:
  workflow_dispatch:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-standalone-staging.yml'

permissions:
  contents: read

concurrency:
  group: motorsales365-standalone-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: staging
      STAGING_URL: https://motorsales365-standalone-staging.jordilwbailey.workers.dev
      STANDALONE_SUPABASE_REF: wjxaajgvddtrxxtocxen
      LOVABLE_SOURCE_REF: jfjrnjyroxvlydajvndl
      ACCEPTANCE_LISTING_ID: a60923a9-e834-4432-9061-563358bc3d9a

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bind Vite client to standalone Supabase staging
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const vars = config.env?.staging?.vars ?? {};
          const expectedProject = process.env.STANDALONE_SUPABASE_REF;
          const expectedUrl = `https://${expectedProject}.supabase.co`;

          if (vars.SUPABASE_PROJECT_ID !== expectedProject || vars.SUPABASE_URL !== expectedUrl) {
            console.error('Staging build blocked: wrangler public Supabase config does not match the standalone project.');
            process.exit(1);
          }
          if (!vars.SUPABASE_PUBLISHABLE_KEY) {
            console.error('Staging build blocked: standalone Supabase publishable key is missing from wrangler staging config.');
            process.exit(1);
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `VITE_SUPABASE_URL=${vars.SUPABASE_URL}\nVITE_SUPABASE_PUBLISHABLE_KEY=${vars.SUPABASE_PUBLISHABLE_KEY}\n`,
          );
          console.log('Bound staging Vite client to standalone Supabase public configuration without printing values.');
          NODE

      - name: Verify Cloudflare deployment credentials are available
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment credentials are not configured in GitHub Actions; staging deployment skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'Cloudflare deployment credentials are present. No credential values are printed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run standalone runtime guard
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          matches="$({
            grep -RInE \
              --exclude='*.map' \
              --exclude='qr-rescue-detector.tsx' \
              --exclude-dir=node_modules \
              'jfjrnjyroxvlydajvndl|\.lovableproject\.com|lovable\.dev/api|lovable\.app/api' \
              src wrangler.jsonc vite.config.ts || true
          } | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*|\*/)' || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            echo 'Standalone staging deployment blocked: Lovable source/runtime endpoint found.' >&2
            exit 1
          fi

      - name: Run unit tests
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm test

      - name: Build standalone staging application
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm run build

      - name: Verify generated deployment is isolated staging
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'dist/server/wrangler.json';
          const expectedName = 'motorsales365-standalone-staging';
          const expectedProject = 'wjxaajgvddtrxxtocxen';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (config.name !== expectedName) {
            console.error(`Blocked: generated Worker name is ${JSON.stringify(config.name)}, expected ${JSON.stringify(expectedName)}.`);
            process.exit(1);
          }

          if (config.vars?.SUPABASE_PROJECT_ID !== expectedProject) {
            console.error('Blocked: generated staging Worker does not target the standalone Supabase project.');
            process.exit(1);
          }

          console.log('Verified isolated staging Worker name and standalone Supabase target.');
          NODE

      - name: Reject source or Lovable refs in built staging runtime
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rq --exclude='*.map' "${LOVABLE_SOURCE_REF}" dist; then
            echo 'Staging deployment blocked: source Supabase ref found in built runtime.' >&2
            exit 1
          fi
          if grep -REqi --exclude='*.map' '\.lovableproject\.com|lovable\.dev/api|lovable\.app/api' dist; then
            echo 'Staging deployment blocked: Lovable endpoint found in built runtime.' >&2
            exit 1
          fi

      - name: Require standalone Supabase in staging browser and server runtimes
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Rq --exclude='*.map' "${STANDALONE_SUPABASE_REF}" dist/server || {
            echo 'Staging deployment blocked: standalone Supabase ref not found in server runtime.' >&2
            exit 1
          }
          browser_match="$(grep -RIl --exclude='*.map' "${STANDALONE_SUPABASE_REF}" dist | grep -v '^dist/server/' | head -n 1 || true)"
          test -n "$browser_match" || {
            echo 'Staging deployment blocked: standalone Supabase ref not found in browser runtime.' >&2
            exit 1
          }
          echo 'Verified staging browser and server runtimes both target standalone Supabase.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy isolated standalone staging Worker
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: staging
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is unavailable in the deploy step.' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is unavailable in the deploy step.' >&2; exit 1; }
          npx wrangler deploy

      - name: Smoke test deployed staging Worker
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Smoke testing ${STAGING_URL}/"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 6 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            --output /tmp/staging-home.html \
            "${STAGING_URL}/"
          test -s /tmp/staging-home.html || { echo 'Staging smoke test returned an empty response body.' >&2; exit 1; }
          echo 'Standalone staging URL responded successfully.' >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke tested: ${STAGING_URL}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Accept public standalone staging routes
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          fetch_route() {
            local route="$1"
            local output="$2"
            local effective
            echo "Testing ${STAGING_URL}${route}"
            effective="$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --retry 4 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 60 \
              --output "$output" \
              --write-out '%{url_effective}' \
              "${STAGING_URL}${route}")"

            test -s "$output" || { echo "${route} returned an empty body." >&2; exit 1; }
            if [[ "$effective" == *"${LOVABLE_SOURCE_REF}"* || "$effective" == *"lovable"* ]]; then
              echo "${route} redirected to a Lovable/source endpoint: ${effective}" >&2
              exit 1
            fi
          }

          fetch_route '/' /tmp/accept-home.html
          fetch_route '/businesses' /tmp/accept-businesses.html
          fetch_route '/map' /tmp/accept-map.html
          fetch_route "/listing/${ACCEPTANCE_LISTING_ID}" /tmp/accept-listing.html

          for body in /tmp/accept-home.html /tmp/accept-businesses.html /tmp/accept-map.html /tmp/accept-listing.html; do
            if grep -Eqi "${LOVABLE_SOURCE_REF}|\.lovableproject\.com|lovable\.dev/api|lovable\.app/api" "$body"; then
              echo "Standalone staging acceptance blocked: source/Lovable runtime reference found in ${body}." >&2
              exit 1
            fi
          done

          grep -Fqi '2007 civic' /tmp/accept-listing.html || {
            echo 'Active standalone listing did not render its expected server-side title.' >&2
            exit 1
          }

          grep -Fqi "https://${STANDALONE_SUPABASE_REF}.supabase.co/storage/v1/object/public/" /tmp/accept-listing.html || {
            echo 'Active listing did not render a standalone Supabase Storage URL.' >&2
            exit 1
          }

          media_url="$(grep -aEo "https://${STANDALONE_SUPABASE_REF}\.supabase\.co/storage/v1/object/public/[^\"<> ]+" /tmp/accept-listing.html | head -n 1 || true)"
          test -n "$media_url" || { echo 'Could not extract standalone listing media URL.' >&2; exit 1; }

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 60 \
            --range 0-0 \
            --output /dev/null \
            "$media_url"

          echo 'Public staging acceptance passed for homepage, businesses, map, active listing, and target Storage media.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Lovable/source runtime reference was observed in tested staging responses.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record staging deployment result
        if: steps.cloudflare.outputs.ready == 'true' && success()
        run: |
          echo 'Standalone staging Worker deployed successfully.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production Worker and production DNS were not modified by this workflow.' >> "$GITHUB_STEP_SUMMARY"
