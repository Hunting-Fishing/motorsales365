name: Import Asian vehicle catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vehicle-catalog-import.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: vehicle-catalog-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'Hunting-Fishing/motorsales365' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check importer logic
        run: node --test scripts/vehicle-catalog/providers.test.mjs scripts/vehicle-catalog/sync.test.mjs scripts/vehicle-catalog/oidc.test.mjs
      - name: Cache and stage a bounded batch
        run: node scripts/vehicle-catalog/sync.mjs
        env:
          API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
          DATAANDAPIS_API_KEY: ${{ secrets.DATAANDAPIS_API_KEY }}
