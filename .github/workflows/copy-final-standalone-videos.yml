name: Copy Final Standalone Videos

on:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - '.github/workflows/copy-final-standalone-videos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SUPABASE_URL: https://jfjrnjyroxvlydajvndl.supabase.co
      TARGET_SUPABASE_URL: https://wjxaajgvddtrxxtocxen.supabase.co
      TARGET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TARGET_SUPABASE_SERVICE_ROLE_KEY }}
      BUCKET: listing-videos
    steps:
      - name: Verify target credential handle exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TARGET_SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo 'Missing TARGET_SUPABASE_SERVICE_ROLE_KEY.' >&2
            exit 1
          }

      - name: Copy and verify two remaining draft videos
        shell: bash
        run: |
          set -euo pipefail

          objects=(
            'drafts/66beaa5c-a1d6-4a24-a6c0-ce6cb5d79f7f/fb46125a-5702-4e3b-a238-ac8de8ebca7f/VIDEO-2026-08-25-01-04-28.mp4'
            'drafts/66beaa5c-a1d6-4a24-a6c0-ce6cb5d79f7f/fb46125a-5702-4e3b-a238-ac8de8ebca7f/VIDEO-2026-08-25-01-04-26.mp4'
          )

          index=0
          for object_path in "${objects[@]}"; do
            index=$((index + 1))
            source_url="${SOURCE_SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${object_path}"
            target_upload_url="${TARGET_SUPABASE_URL}/storage/v1/object/${BUCKET}/${object_path}"
            target_public_url="${TARGET_SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${object_path}"
            source_file="/tmp/source-${index}.mp4"
            target_file="/tmp/target-${index}.mp4"

            echo "Downloading source object ${index}/2."
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 3 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              --output "$source_file" \
              "$source_url"

            source_size="$(stat -c '%s' "$source_file")"
            if (( source_size < 80000000 )); then
              echo "Source object ${index} is unexpectedly small: ${source_size} bytes." >&2
              exit 1
            fi
            source_sha="$(sha256sum "$source_file" | awk '{print $1}')"
            echo "Source object ${index}: ${source_size} bytes."

            echo "Uploading object ${index}/2 to standalone Storage."
            code="$(curl --silent --show-error \
              --output /tmp/upload-response-${index}.txt \
              --write-out '%{http_code}' \
              --request POST \
              --header "apikey: ${TARGET_SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${TARGET_SUPABASE_SERVICE_ROLE_KEY}" \
              --header 'Content-Type: video/mp4' \
              --header 'x-upsert: true' \
              --data-binary "@${source_file}" \
              "$target_upload_url" || true)"

            if [[ "$code" != '200' && "$code" != '201' ]]; then
              echo "Standalone upload ${index} failed with HTTP ${code}." >&2
              cat /tmp/upload-response-${index}.txt >&2 || true
              exit 1
            fi

            echo "Downloading standalone object ${index}/2 for hash verification."
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 3 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              --output "$target_file" \
              "$target_public_url"

            target_size="$(stat -c '%s' "$target_file")"
            target_sha="$(sha256sum "$target_file" | awk '{print $1}')"

            if [[ "$target_size" != "$source_size" ]]; then
              echo "Size mismatch for object ${index}: source=${source_size}, target=${target_size}." >&2
              exit 1
            fi
            if [[ "$target_sha" != "$source_sha" ]]; then
              echo "SHA-256 mismatch for object ${index}." >&2
              exit 1
            fi

            echo "Verified object ${index}/2: identical size and SHA-256."
            rm -f "$source_file" "$target_file"
          done

          echo 'Both remaining oversized draft videos were copied and verified byte-for-byte.' >> "$GITHUB_STEP_SUMMARY"
