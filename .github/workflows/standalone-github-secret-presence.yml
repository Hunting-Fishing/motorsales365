name: Standalone GitHub Secret Presence

on:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - '.github/workflows/standalone-github-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TARGET_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SIGNUP_AUDIT_SALT: ${{ secrets.SIGNUP_AUDIT_SALT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      EMAIL_QUEUE_CRON_TOKEN: ${{ secrets.EMAIL_QUEUE_CRON_TOKEN }}
      STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
      STRIPE_SANDBOX_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY }}
      PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
      PAYMENTS_SANDBOX_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_SANDBOX_WEBHOOK_SECRET }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      INVOLVE_ASIA_AFFILIATE_ID: ${{ secrets.INVOLVE_ASIA_AFFILIATE_ID }}
      INVOLVE_ASIA_API_KEY_NAME: ${{ secrets.INVOLVE_ASIA_API_KEY_NAME }}
      INVOLVE_ASIA_API_SECRET: ${{ secrets.INVOLVE_ASIA_API_SECRET }}
    steps:
      - name: Record configured secret names only
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/configured.txt
          : > /tmp/missing.txt
          for name in \
            TARGET_SUPABASE_SERVICE_ROLE_KEY SUPABASE_SERVICE_ROLE_KEY SIGNUP_AUDIT_SALT \
            RESEND_API_KEY RESEND_WEBHOOK_SECRET EMAIL_QUEUE_CRON_TOKEN \
            STRIPE_LIVE_API_KEY STRIPE_SANDBOX_API_KEY PAYMENTS_LIVE_WEBHOOK_SECRET PAYMENTS_SANDBOX_WEBHOOK_SECRET \
            GOOGLE_MAPS_API_KEY AI_API_BASE_URL AI_API_KEY AI_MODEL FIRECRAWL_API_KEY GIPHY_API_KEY \
            INVOLVE_ASIA_AFFILIATE_ID INVOLVE_ASIA_API_KEY_NAME INVOLVE_ASIA_API_SECRET
          do
            if [[ -n "${!name:-}" ]]; then
              printf '%s\n' "$name" >> /tmp/configured.txt
            else
              printf '%s\n' "$name" >> /tmp/missing.txt
            fi
          done
          echo "Configured: $(wc -l < /tmp/configured.txt)"
          echo "Missing: $(wc -l < /tmp/missing.txt)"

      - name: Upload presence inventory
        uses: actions/upload-artifact@v4
        with:
          name: standalone-github-secret-presence
          path: |
            /tmp/configured.txt
            /tmp/missing.txt
          retention-days: 1
