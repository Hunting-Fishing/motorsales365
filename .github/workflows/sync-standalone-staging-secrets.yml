name: Sync Standalone Staging Secrets

on:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - '.github/workflows/sync-standalone-staging-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TARGET_SUPABASE_SERVICE_ROLE_KEY }}
      SIGNUP_AUDIT_SALT: ${{ secrets.SIGNUP_AUDIT_SALT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      EMAIL_QUEUE_CRON_TOKEN: ${{ secrets.EMAIL_QUEUE_CRON_TOKEN }}
      STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
      STRIPE_SANDBOX_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY }}
      PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
      PAYMENTS_SANDBOX_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_SANDBOX_WEBHOOK_SECRET }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      INVOLVE_ASIA_AFFILIATE_ID: ${{ secrets.INVOLVE_ASIA_AFFILIATE_ID }}
      INVOLVE_ASIA_API_KEY_NAME: ${{ secrets.INVOLVE_ASIA_API_KEY_NAME }}
      INVOLVE_ASIA_API_SECRET: ${{ secrets.INVOLVE_ASIA_API_SECRET }}

    steps:
      - name: Verify deployment credentials and required core secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'Missing TARGET_SUPABASE_SERVICE_ROLE_KEY. Core authenticated staging cannot be enabled yet.' >&2; exit 1; }

      - name: Verify service-role key belongs to standalone Supabase
        shell: bash
        run: |
          set -euo pipefail
          target='https://wjxaajgvddtrxxtocxen.supabase.co/rest/v1/profiles?select=id&limit=1'
          code="$(curl --silent --show-error --output /tmp/service-role-check.json --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "$target")"
          if [[ "$code" != '200' ]]; then
            echo "TARGET_SUPABASE_SERVICE_ROLE_KEY did not authenticate against standalone project wjxaajgvddtrxxtocxen (HTTP ${code}). Refusing to bind it." >&2
            exit 1
          fi
          echo 'Target service-role key authenticated against standalone Supabase. Value was not printed.'

      - name: Bind configured secret values to isolated staging Worker
        shell: bash
        run: |
          set -euo pipefail
          worker='motorsales365-standalone-staging'
          sync_secret() {
            local name="$1"
            local value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Skipping unconfigured optional secret: $name"
              return 0
            fi
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --name "$worker" >/dev/null
            echo "Bound $name"
          }

          for name in \
            SUPABASE_SERVICE_ROLE_KEY SIGNUP_AUDIT_SALT \
            RESEND_API_KEY RESEND_WEBHOOK_SECRET EMAIL_QUEUE_CRON_TOKEN \
            STRIPE_LIVE_API_KEY STRIPE_SANDBOX_API_KEY \
            PAYMENTS_LIVE_WEBHOOK_SECRET PAYMENTS_SANDBOX_WEBHOOK_SECRET \
            GOOGLE_MAPS_API_KEY AI_API_BASE_URL AI_API_KEY AI_MODEL \
            FIRECRAWL_API_KEY GIPHY_API_KEY \
            INVOLVE_ASIA_AFFILIATE_ID INVOLVE_ASIA_API_KEY_NAME INVOLVE_ASIA_API_SECRET
          do
            sync_secret "$name"
          done

      - name: Verify core binding exists by name only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --name motorsales365-standalone-staging > /tmp/secret-list.txt
          grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' /tmp/secret-list.txt || {
            echo 'SUPABASE_SERVICE_ROLE_KEY binding was not found after sync.' >&2
            exit 1
          }
          echo 'Core standalone staging secret binding verified. No secret values were printed.'
