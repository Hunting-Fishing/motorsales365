name: Temporary Standalone Google Auth Probe

on:
  push:
    branches:
      - tmp-google-auth-probe
    paths:
      - '.github/workflows/tmp-google-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://wjxaajgvddtrxxtocxen.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_RTI8m0ZvjoZFH7_q-wnIQQ_SxrL0s-d
      STAGING_URL: https://motorsales365-standalone-staging.jordilwbailey.workers.dev
      EXPECTED_CALLBACK: https://wjxaajgvddtrxxtocxen.supabase.co/auth/v1/callback
    steps:
      - name: Verify public Auth provider settings
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/settings.json --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/auth/v1/settings")"
          [[ "$code" == '200' ]] || { echo "settings_http=${code}"; exit 1; }
          google="$(jq -r '.external.google' /tmp/settings.json)"
          email="$(jq -r '.external.email' /tmp/settings.json)"
          disabled="$(jq -r '.disable_signup' /tmp/settings.json)"
          echo "google_enabled=${google}"
          echo "email_enabled=${email}"
          echo "signup_disabled=${disabled}"
          [[ "$google" == 'true' ]]
          [[ "$email" == 'true' ]]
          [[ "$disabled" == 'false' ]]

      - name: Verify Google authorization redirect
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --dump-header /tmp/auth-headers.txt --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --get "${SUPABASE_URL}/auth/v1/authorize" \
            --data-urlencode 'provider=google' \
            --data-urlencode "redirect_to=${STAGING_URL}/login")"
          echo "authorize_http=${status}"
          [[ "$status" =~ ^30[12378]$ ]]
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' /tmp/auth-headers.txt)"
          [[ -n "$location" ]]
          LOCATION="$location" python3 - <<'PY'
          import os
          from urllib.parse import urlparse, parse_qs
          u = urlparse(os.environ['LOCATION'])
          qs = parse_qs(u.query)
          host = (u.hostname or '').lower()
          callback = (qs.get('redirect_uri') or [''])[0]
          print(f'provider_redirect_host={host}')
          print(f'callback_matches_target={str(callback == os.environ["EXPECTED_CALLBACK"]).lower()}')
          if host != 'accounts.google.com':
              raise SystemExit('Unexpected OAuth provider host')
          if callback != os.environ['EXPECTED_CALLBACK']:
              raise SystemExit('Unexpected Supabase callback')
          PY
