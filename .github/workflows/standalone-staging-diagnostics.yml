name: Standalone Staging Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - '.github/workflows/standalone-staging-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_URL: https://motorsales365-standalone-staging.jordilwbailey.workers.dev
      STANDALONE_SUPABASE_REF: wjxaajgvddtrxxtocxen
      LOVABLE_SOURCE_REF: jfjrnjyroxvlydajvndl
      ACCEPTANCE_LISTING_ID: a60923a9-e834-4432-9061-563358bc3d9a

    steps:
      - name: Fetch homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 60 --output /tmp/home.html "${STAGING_URL}/"
          test -s /tmp/home.html

      - name: Fetch businesses
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 60 --output /tmp/businesses.html "${STAGING_URL}/businesses"
          test -s /tmp/businesses.html

      - name: Fetch map
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 60 --output /tmp/map.html "${STAGING_URL}/map"
          test -s /tmp/map.html

      - name: Fetch active listing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 60 --output /tmp/listing.html "${STAGING_URL}/listing/${ACCEPTANCE_LISTING_ID}"
          test -s /tmp/listing.html

      - name: Reject Lovable runtime references
        shell: bash
        run: |
          set -euo pipefail
          for body in /tmp/home.html /tmp/businesses.html /tmp/map.html /tmp/listing.html; do
            if grep -Eqi "${LOVABLE_SOURCE_REF}|\.lovableproject\.com|lovable\.dev/api|lovable\.app/api" "$body"; then
              echo "Lovable/source runtime reference found in ${body}." >&2
              exit 1
            fi
          done

      - name: Verify listing SSR title
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqi '2007 civic' /tmp/listing.html

      - name: Verify standalone Storage URL in SSR
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqi "https://${STANDALONE_SUPABASE_REF}.supabase.co/storage/v1/object/public/" /tmp/listing.html
          grep -Eo "https://${STANDALONE_SUPABASE_REF}\.supabase\.co/storage/v1/object/public/[^\"<> ]+" /tmp/listing.html | head -n 1 > /tmp/media-url.txt
          test -s /tmp/media-url.txt

      - name: Verify public Storage media fetch
        shell: bash
        run: |
          set -euo pipefail
          media_url="$(cat /tmp/media-url.txt)"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 --range 0-0 --output /dev/null "$media_url"

      - name: Diagnostics passed
        run: echo 'All standalone staging acceptance diagnostics passed.'
