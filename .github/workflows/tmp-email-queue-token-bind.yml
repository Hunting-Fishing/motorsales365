name: Temporary Email Queue Reprobe

on:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - '.github/workflows/tmp-email-queue-token-bind.yml'

permissions:
  contents: read

jobs:
  reprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TARGET_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://wjxaajgvddtrxxtocxen.supabase.co
      STAGING_URL: https://motorsales365-standalone-staging.jordilwbailey.workers.dev
    steps:
      - name: Retrieve existing email queue token without logging it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          umask 077
          status="$(curl --silent --show-error --output /tmp/email-queue-row.json --write-out '%{http_code}' \
            --get "${SUPABASE_URL}/rest/v1/internal_cron_tokens" \
            --data-urlencode 'job_name=eq.email_queue' \
            --data-urlencode 'select=token' \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")"
          [[ "$status" == '200' ]]
          jq -er 'length == 1 and (.[0].token | type == "string" and length >= 40)' /tmp/email-queue-row.json >/dev/null
          jq -r '.[0].token' /tmp/email-queue-row.json > /tmp/email-queue-token
          rm -f /tmp/email-queue-row.json
          echo 'existing_email_queue_token_loaded=true'

      - name: Probe protected empty staging email queue
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/email-queue-token)"
          status="$(curl --silent --show-error --output /tmp/queue-response.json --write-out '%{http_code}' \
            --request POST "${STAGING_URL}/api/internal/email/queue/process" \
            --header "x-cron-token: ${token}" \
            --header 'Content-Type: application/json' \
            --data '{}')"
          echo "queue_probe_http=${status}"
          if [[ "$status" != '200' ]]; then
            error="$(jq -r '.error // .reason // "unknown"' /tmp/queue-response.json 2>/dev/null || echo unknown)"
            echo "queue_probe_error=${error}"
            exit 1
          fi
          processed="$(jq -r '.processed // -1' /tmp/queue-response.json)"
          echo "queue_processed=${processed}"
          [[ "$processed" == '0' ]]
          rm -f /tmp/email-queue-token /tmp/queue-response.json
          echo 'email_queue_runtime_verified=true'
