name: Standalone Cloudflare Secret Inventory

on:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - '.github/workflows/standalone-cloudflare-secret-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Inventory staging Worker secret names
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --env staging > /tmp/worker-secrets.json
          node <<'NODE'
          const fs = require('fs');
          const input = JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8'));
          const names = Array.isArray(input) ? input.map((x) => x.name).filter(Boolean).sort() : [];
          fs.writeFileSync('/tmp/worker-secret-names.txt', names.length ? names.join('\n') + '\n' : '(none)\n');
          console.log(`Found ${names.length} staging Worker secret name(s). Values were not read or printed.`);
          NODE

      - name: Upload secret-name inventory
        uses: actions/upload-artifact@v4
        with:
          name: standalone-cloudflare-secret-names
          path: /tmp/worker-secret-names.txt
          retention-days: 1
