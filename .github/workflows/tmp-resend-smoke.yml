name: Temporary Resend Smoke

on:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - '.github/workflows/tmp-resend-smoke.yml'

permissions:
  contents: read

jobs:
  resend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Verify Resend sending from standalone auth domain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RESEND_API_KEY:-}" || { echo 'RESEND_API_KEY missing'; exit 1; }

          status="$(curl --silent --show-error \
            --output /tmp/resend-response.json \
            --write-out '%{http_code}' \
            --request POST 'https://api.resend.com/emails' \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'Idempotency-Key: 365-standalone-resend-smoke-20260830' \
            --data '{"from":"365 Motor Sales <no-reply@auth.365motorsales.com>","to":["delivered@resend.dev"],"subject":"365 standalone Resend smoke","text":"Standalone Resend provider verification."}')"

          echo "resend_http=${status}"
          if [[ ! "$status" =~ ^20[01]$ ]]; then
            message="$(jq -r '.message // .error // "unknown Resend error"' /tmp/resend-response.json 2>/dev/null || echo 'unknown Resend error')"
            echo "resend_error=${message}"
            exit 1
          fi
          jq -e '.id | type == "string" and length > 0' /tmp/resend-response.json >/dev/null
          echo 'resend_send_verified=true'
          echo 'from_domain=auth.365motorsales.com'
          echo 'test_recipient=delivered@resend.dev'
