name: Fix Standalone Acceptance Matcher

on:
  push:
    branches:
      - migration/standalone-supabase-365
    paths:
      - '.github/workflows/fix-standalone-acceptance-grep.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/standalone-supabase-365

      - name: Make media extraction binary-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-standalone-staging.yml')
          text = path.read_text()
          old = 'media_url="$(grep -Eo "https://${STANDALONE_SUPABASE_REF}\\\\.supabase\\\\.co/storage/v1/object/public/[^\\\"<> ]+" /tmp/accept-listing.html | head -n 1 || true)"'
          new = 'media_url="$(grep -aEo "https://${STANDALONE_SUPABASE_REF}\\\\.supabase\\\\.co/storage/v1/object/public/[^\\\"<> ]+" /tmp/accept-listing.html | head -n 1 || true)"'
          if old not in text:
              raise SystemExit('Expected standalone media extraction command was not found; refusing broad edit.')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- .github/workflows/deploy-standalone-staging.yml

      - name: Commit acceptance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '366 Industries'
          git config user.email '103216816+Hunting-Fishing@users.noreply.github.com'
          git add .github/workflows/deploy-standalone-staging.yml
          git commit -m 'ci: make standalone media extraction binary-safe'
          git push origin HEAD:migration/standalone-supabase-365

      - name: Dispatch real standalone staging gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-standalone-staging.yml --ref migration/standalone-supabase-365
